- name: Download epubcheck, refused unless its SHA-256 matches
  ansible.builtin.get_url:
    url: "{{ epubcheck_release_url }}/v{{ ep }}/epubcheck-{{ ep }}.zip"
    dest: "{{ ti_cache_dir }}/epubcheck-{{ ep }}.zip"
    checksum: "sha256:{{ pins_epubcheck[ep] }}"
    mode: "0644"
  register: epubcheck_got
  until: epubcheck_got is not oerforge.textbookimprover.retryable
  retries: "{{ ti_download_retries }}"
  delay: "{{ ti_download_delay }}"

- name: Unpack it
  ansible.builtin.unarchive:
    src: "{{ ti_cache_dir }}/epubcheck-{{ ep }}.zip"
    dest: "{{ ti_opt_dir }}"
    remote_src: true
    creates: "{{ epubcheck_jar }}"
