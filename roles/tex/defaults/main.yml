# Which TeX to install, in the user's home, so that tlmgr needs no sudo:
#   tinytex  TinyTeX's bundle, a small TeX Live, with the installation page's
#            packages added: what TextbookImprover's installation page tests,
#            so a machine with it shows when that page's list leaves one out
#   texlive  TeX Live from its own installer, every package in the scheme
#            (full by default: several gigabytes; 17 minutes here without its
#            documentation and sources, which the role leaves out)
# TinyTeX for the user profile; TeX Live for the developer profile, whose
# languages the suites need.
tex_distribution: "{{ 'texlive' if ti_profile == 'developer' else 'tinytex' }}"

# Which day's TeX Live packages: a date, for that day's snapshot of TeX
# Live's repository, which texlive.info keeps, or latest, for the packages of
# the day TeX is installed or updated. A date's snapshot needs its SHA-512
# pinned in vars/pins.yml (util/update-pins.py add tex_snapshot <date>), or in
# the inventory, as ti_pins.tex_snapshot. Each run brings TeX to the date:
# forward by updating, and back by installing again, from the snapshot, the
# packages tlmgr won't take back. When tlmgr won't read an older repository
# at all, which is when TeX is even a day newer, the role installs the whole
# of a TeX it installed again: TinyTeX's bundle, or TeX Live's full scheme,
# several gigabytes and a quarter of an hour. The TeX there is put aside
# until the new one is installed, and put back if that fails, so there's
# room needed for both meanwhile. A package added by hand with tlmgr goes
# then; name it in tex_extra_packages instead. A TeX already at the date is
# left alone, with no request to the snapshot.
tex_snapshot: "2026-11-20"
tex_snapshot_url: https://texlive.info/tlnet-archive

# Packages held at a date of their own, each installed as it was on that day,
# after the rest, and left out of every update, as ltx-talk: "2026-11-19":
# a way back from a package's release that breaks something, while the rest
# moves on. Each date's snapshot needs its SHA-512 pinned, as tex_snapshot's
# does. A held package is installed if it isn't yet, from tex_snapshot's
# snapshot first, for what it depends on, so it has to be there too. Taken
# out of this list, a package is installed again from the repository the
# rest come from.
tex_held_packages: {}

# With tex_snapshot set to latest, the repository tlmgr installs and updates
# from, set before anything is fetched. Empty leaves TinyTeX's own choice (a
# mirror chosen for you), and gives the TeX Live installer CTAN's mirror
# service. A network that allows only named hosts needs a fixed mirror, such
# as https://ctan.math.illinois.edu/systems/texlive/tlnet.
tex_repository: ""

# With tex_snapshot set to latest, bring every package up to date (tlmgr
# update --self --all) on this run. A new TinyTeX is always brought up to date
# once; after that, only when asked, so that a second run changes nothing.
# With a date, compare TeX with the snapshot again, even if it was brought to
# that date before.
tex_update: false

# The installation page's tlmgr install lines, whichever TeX: a full TeX Live
# has them all already.
tex_packages:
  # The tagging code and what Pandoc's template loads, and the PDF target's
  # faces and settings
  - latex-lab
  - tagpdf
  - luamml
  - luatexbase
  - selnolig
  - luacolor
  - lua-ul
  - footnotehyper
  - xurl
  - nameref
  - multirow
  - cancel
  - pict2e
  - placeins
  - setspace
  - geometry
  - koma-script
  - plex
  - noto
  - noto-emoji
  - josefin
  - junicodevf
  # A LaTeX source's drawings and its tagging status
  - luatex85
  - preview
  - epstopdf
  - latex-tagging-status
  # A deck's PDF
  - ltx-talk
  - lua-unicode-math
  - newcomputermodern
  # The LaTeX suite's small books
  - amsfonts
  - amsmath
  - babel-english
  - caption
  - fancyhdr
  - framed
  - grfext
  - mdframed
  - pgf
  - soul
  - tabto-ltx
  - tex-gyre
  - titlesec
  - tools
  - ulem
  - wasysym
  - wrapfig

# More packages: a language's babel- and hyphen- packages, say, or what a
# book of your own loads.
tex_extra_packages: []

# TeX Live's Noto Emoji, for an emoji in an OpenStax book's text, when the
# fonts for OpenStax's books are asked for (ti_fonts).
tex_font_packages: "{{ ['noto-emoji'] if ti_fonts | bool else [] }}"

# The oldest LaTeX a PDF target builds with.
tex_latex_minimum: "2026-06-01"

# TinyTeX's release; its bundle's SHA-256 is pinned in vars/pins.yml.
tinytex_version: "v2026.11"
tinytex_release_url: https://github.com/rstudio/tinytex-releases/releases/download

# TeX Live from its own installer: the release, which the installer's
# version has to match, the scheme, and where it goes.
texlive_year: "2026"
texlive_scheme: full
texlive_docs: false
texlive_source: false
texlive_dir: "{{ ti_opt_dir }}/texlive/{{ texlive_year }}"

# Where TeX is, and its commands, which the fonts role uses too.
tex_root: "{{ ti_home ~ '/.TinyTeX' if tex_distribution == 'tinytex' else texlive_dir }}"
tex_bin: "{{ tex_root }}/bin/x86_64-linux"
