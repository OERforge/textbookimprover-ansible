- name: Install TextbookImprover
  tags: [user]
  become: "{{ ti_user != ansible_facts['user_id'] }}"
  become_user: "{{ ti_user }}"
  vars:
    pins: "{{ (ti_pins.textbookimprover | default({})) | combine(textbookimprover_pins) }}"
    release: "{{ ti_source == 'release' }}"
    full_commit: "{{ ti_version is match('^[0-9a-f]{40}$') }}"
  block:
    - name: Read the pinned commits
      ansible.builtin.include_vars: pins.yml

    - name: Stop on a source this role doesn't know
      ansible.builtin.assert:
        that: ti_source in ['release', 'git']
        fail_msg: "ti_source is {{ ti_source }}; it's release or git."
        quiet: true

    - name: Stop on a release with no pinned commit
      ansible.builtin.assert:
        that: (ti_version | string) in pins
        fail_msg: >-
          TextbookImprover {{ ti_version }} has no pinned commit here. Give the
          commit its tag should name in the inventory, as
          ti_pins: {textbookimprover: {"{{ ti_version }}": <commit>}}.
        quiet: true
      when: release

    - name: Clone it at the release's tag, or at the ref asked for
      ansible.builtin.git:
        repo: "{{ ti_repository }}"
        dest: "{{ ti_dir | trim }}"
        version: "{{ 'v' ~ ti_version if release else ti_version }}"
        depth: "{{ 1 if release else omit }}"
        update: "{{ true if release else ti_update_clone | bool }}"
        force: false
      environment:
        # a clone that stalls fails, and is tried again, rather than hanging:
        # under 1,000 bytes a second for a minute
        GIT_HTTP_LOW_SPEED_LIMIT: "1000"
        GIT_HTTP_LOW_SPEED_TIME: "60"
      register: ti_clone
      until: ti_clone is not oerforge.textbookimprover.retryable
      retries: "{{ ti_download_retries }}"
      delay: "{{ ti_download_delay }}"

    - name: Check that the release's tag names its pinned commit
      ansible.builtin.assert:
        that: ti_clone.after == pins[ti_version | string]
        fail_msg: >-
          v{{ ti_version }} names {{ ti_clone.after }}, where the pinned commit
          is {{ pins[ti_version | string] }}. The tag has moved, or this isn't
          TextbookImprover's repository; nothing in {{ ti_dir | trim }} should
          be used.
        success_msg: "TextbookImprover {{ ti_version }} at {{ ti_clone.after }}"
      when: release

    - name: Check that a commit asked for in full is the one checked out
      ansible.builtin.assert:
        that: ti_clone.after == ti_version
        fail_msg: "{{ ti_dir | trim }} is at {{ ti_clone.after }}, not {{ ti_version }}."
      when: not release and full_commit

    - name: Set T to it in the shell
      ansible.builtin.blockinfile:
        path: "{{ ti_shell_rc }}"
        create: true
        mode: "0644"
        marker: "# {mark} textbookimprover-ansible: T"
        block: |
          export T="{{ ti_dir | trim }}"

    # A release's clone is marked inside .git, where the work tree's own
    # status doesn't see it. An older release's clone is removed once this
    # one is in, only where it's marked and holds nothing of the person's:
    # TextbookImprover's .gitignore leaves out a conversion's output and
    # sidecars, which may be someone's work, so only Python's own cache is
    # passed over. A clone of a branch (ti_source: git) is never removed.
    - name: Mark the release's clone as this collection's
      when: release
      ansible.builtin.copy:
        content: >
          Cloned by textbookimprover-ansible, which removes this clone once
          another release is asked for, if nothing in it has changed.
        dest: "{{ ti_dir | trim }}/.git/textbookimprover-ansible"
        mode: "0644"
        force: false

    - name: Find the release clones beside it
      ansible.builtin.find:
        paths: "{{ ti_dir | trim | dirname }}"
        patterns: ['^textbookimprover-[0-9][^/]*$']
        use_regex: true
        file_type: directory
      register: ti_releases

    - name: Look for this collection's mark on each
      ansible.builtin.stat:
        path: "{{ item }}/.git/textbookimprover-ansible"
      register: ti_marks
      loop: >-
        {{ ti_releases.files | map(attribute='path') | map('regex_replace', '/+', '/')
           | reject('equalto', ti_dir | trim | regex_replace('/+', '/')) | list }}

    # Anything it prints, or a failure, keeps the clone.
    - name: Ask each marked one whether anything in it is the person's
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - |
            set -eu
            tag=$(git -C "$1" describe --tags --exact-match HEAD)
            [ "$tag" = "v${1##*/textbookimprover-}" ] || echo "HEAD is at $tag, not the folder's release"
            git -C "$1" status --porcelain=v1 --ignored --untracked-files=normal \
              | grep -Ev '^!! (.*/)?__pycache__/$|^!! .*\.py[cod]$' || true
            git -C "$1" stash list
            git -C "$1" log --branches --not HEAD --oneline
          - sh
          - "{{ item }}"
      environment:
        LC_ALL: C
      register: ti_old_state
      changed_when: false
      failed_when: false
      loop: "{{ ti_marks.results | selectattr('stat.exists') | map(attribute='item') | list }}"

    - name: Remove those that hold nothing of the person's
      when: item.rc == 0 and (item.stdout ~ item.stderr) | trim == ''
      ansible.builtin.file:
        path: "{{ item.item }}"
        state: absent
      loop: "{{ ti_old_state.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Say which are kept, and why
      when: not (item.rc == 0 and (item.stdout ~ item.stderr) | trim == '')
      ansible.builtin.debug:
        msg: >-
          {{ item.item }} is an older release's clone, kept because something in
          it may be yours: {{ (item.stdout ~ ' ' ~ item.stderr) | trim | truncate(300) }}.
          Remove it yourself when it holds nothing you want.
      loop: "{{ ti_old_state.results }}"
      loop_control:
        label: "{{ item.item }}"
