# release: a clone at a release's tag, its commit checked against the one
# pinned for that release. git: a clone of a branch, tag, or commit
# (a commit given in full is checked too). The developer profile takes git.
ti_source: "{{ 'git' if ti_profile == 'developer' else 'release' }}"

# The release (without its "v") for ti_source: release, or the branch, tag,
# or commit for ti_source: git.
ti_version: "{{ '0.10' if ti_source == 'release' else 'main' }}"

# Where it goes: the installation page's folders by default.
ti_dir: >-
  {{ ti_home }}/tools/textbookimprover{{
  '-' ~ ti_version if ti_source == 'release' else '' }}

ti_repository: https://github.com/OERforge/textbookimprover.git

# For ti_source: git, whether a play updates the clone to ti_version. A clone
# with changes of its own isn't touched either way: the play stops instead.
# The developer profile makes its clone once and then leaves it alone, since
# it's the developer's own to update and may hold work in progress.
ti_update_clone: "{{ ti_profile != 'developer' }}"
