# What working on TextbookImprover needs beyond converting books: the test
# suites' Python packages from apt, the oldest Python the code is kept
# working on, and the clone of OpenStax's cookbook its CNX ports are
# compared with.

# Python 3.9, installed by uv, which checks each build against the SHA-256 in
# its own table, and linked as python3.9 in ~/.local/bin, where the
# portability suite looks for it. uv itself is kept in ~/.local/opt and not
# put on PATH, so a uv of the person's own is left alone. False leaves it out.
developer_python39: true
developer_python39_version: "3.9.25"
uv_version: "0.13.9"
uv_release_url: https://github.com/astral-sh/uv/releases/download

# openstax/cookbook at the commit TextbookImprover's CNX ports were made
# from (notes/CNX-NOTES.md), named by CNX_COOKBOOK, which turns on the CNX
# suite's comparisons with it. False leaves it out.
developer_cookbook: true
cookbook_repository: https://github.com/openstax/cookbook.git
cookbook_dir: "{{ ti_home }}/tools/openstax-cookbook"
