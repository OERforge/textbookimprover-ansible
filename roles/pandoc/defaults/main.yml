# The Pandoc releases to install. The first is linked as `pandoc`; every one
# is linked as `pandoc-<version>` too. The developer profile has every
# release pinned, to run the suites under each before a release.
pandoc_versions: "{{ ['3.14', '3.13', '3.12.1'] if ti_profile == 'developer' else ['3.14'] }}"

# Where Pandoc's releases are published; each tarball's name follows it.
pandoc_release_url: https://github.com/jgm/pandoc/releases/download
