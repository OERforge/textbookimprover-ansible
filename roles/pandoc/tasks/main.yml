- name: Install Pandoc's releases
  tags: [user]
  become: "{{ ti_user != ansible_facts['user_id'] }}"
  become_user: "{{ ti_user }}"
  vars:
    pins: "{{ (ti_pins.pandoc | default({})) | combine(pandoc_pins) }}"
  block:
    - name: Read the pinned checksums
      ansible.builtin.include_vars: pins.yml

    - name: Stop on a version with no pinned checksum
      ansible.builtin.assert:
        that: (item | string) in pins
        fail_msg: >-
          Pandoc {{ item }} has no SHA-256 here. Give one you trust in the
          inventory, as ti_pins: {pandoc: {"{{ item }}": <sha256>}}.
        quiet: true
      loop: "{{ pandoc_versions }}"

    - name: Download each release, refused unless its SHA-256 matches
      ansible.builtin.get_url:
        url: "{{ pandoc_release_url }}/{{ item }}/pandoc-{{ item }}-linux-amd64.tar.gz"
        dest: "{{ ti_cache_dir }}/pandoc-{{ item }}-linux-amd64.tar.gz"
        checksum: "sha256:{{ pins[item | string] }}"
        mode: "0644"
      register: pandoc_got
      until: pandoc_got is not oerforge.textbookimprover.retryable
      retries: "{{ ti_download_retries }}"
      delay: "{{ ti_download_delay }}"
      loop: "{{ pandoc_versions }}"

    - name: Unpack each release into its own folder
      ansible.builtin.unarchive:
        src: "{{ ti_cache_dir }}/pandoc-{{ item }}-linux-amd64.tar.gz"
        dest: "{{ ti_opt_dir }}"
        remote_src: true
        creates: "{{ ti_opt_dir }}/pandoc-{{ item }}/bin/pandoc"
      loop: "{{ pandoc_versions }}"

    - name: Link each as pandoc-<version>
      ansible.builtin.file:
        src: "{{ ti_opt_dir }}/pandoc-{{ item }}/bin/pandoc"
        dest: "{{ ti_bin_dir }}/pandoc-{{ item }}"
        state: link
      loop: "{{ pandoc_versions }}"

    - name: Link the first as pandoc
      ansible.builtin.file:
        src: "{{ ti_opt_dir }}/pandoc-{{ pandoc_versions[0] }}/bin/pandoc"
        dest: "{{ ti_bin_dir }}/pandoc"
        state: link

    - name: Ask the linked Pandoc its version
      ansible.builtin.command:
        argv: ["{{ ti_bin_dir }}/pandoc", --version]
      register: ti_pandoc_version
      changed_when: false

    - name: Check that it's the version asked for
      ansible.builtin.assert:
        that: ti_pandoc_version.stdout_lines[0] == 'pandoc ' ~ pandoc_versions[0]
        fail_msg: "{{ ti_bin_dir }}/pandoc says {{ ti_pandoc_version.stdout_lines[0] }}"
        success_msg: "{{ ti_pandoc_version.stdout_lines[0] }}"

    - name: Remove the Pandoc releases no longer asked for
      ansible.builtin.import_role:
        name: oerforge.textbookimprover.base
        tasks_from: old_versions
      vars:
        old_versions_what: Pandoc
        old_versions_in: "{{ ti_opt_dir }}"
        old_versions_name: 'pandoc-[0-9][^/]*'
        old_versions_keep: "{{ pandoc_versions | map('string') | map('regex_replace', '^', ti_opt_dir ~ '/pandoc-') | list }}"
        old_versions_cache: 'pandoc-[0-9][^/]*-linux-amd64\.tar\.gz'
        old_versions_cache_keep: "{{ pandoc_versions | map('string') | map('regex_replace', '^(.*)$', 'pandoc-\\1-linux-amd64.tar.gz') | list }}"
