namespace: oerforge
name: textbookimprover
version: 0.1.0
readme: README.md
authors:
  - TextbookImprover's contributors
description: Sets up a machine to use or develop TextbookImprover, following its installation page.
license:
  - MIT
tags:
  - tools
  - linux
  - textbookimprover
  - accessibility
  - pandoc
  - oer
repository: https://github.com/OERforge/textbookimprover-ansible
issues: https://github.com/OERforge/textbookimprover-ansible/issues
build_ignore:
  - tests
  - util
  - "*.mbox"
  # Secrets, as in .gitignore, which ansible-galaxy doesn't read. A pattern
  # is matched against the path from the top, and its * matches a slash too,
  # so each name is given alone and under a folder.
  - "id_rsa*"
  - "*/id_rsa*"
  - "id_dsa*"
  - "*/id_dsa*"
  - "id_ecdsa*"
  - "*/id_ecdsa*"
  - "id_ed25519*"
  - "*/id_ed25519*"
  - "*.pem"
  - "*/*.pem"
  - "*.key"
  - "*/*.key"
  - "*.p12"
  - "*/*.p12"
  - "*.pfx"
  - "*/*.pfx"
  - ".vault_pass*"
  - "*/.vault_pass*"
  - "vault_pass*"
  - "*/vault_pass*"
  - ".vault-password*"
  - "*/.vault-password*"
  - "*.vault-password"
  - "*/*.vault-password"
  - ".env"
  - "*/.env"
  - ".env.*"
  - "*/.env.*"
  - "*.token"
  - "*/*.token"
  - "inventory"
  - "*/inventory"
  - "inventory.*"
  - "*/inventory.*"
  - "inventories"
  - "*/inventories"
  - "hosts"
  - "*/hosts"
  - "hosts.yml"
  - "*/hosts.yml"
  - "hosts.yaml"
  - "*/hosts.yaml"
  - "hosts.ini"
  - "*/hosts.ini"
  - "host_vars"
  - "*/host_vars"
  - "group_vars"
  - "*/group_vars"
