# Set up a machine for working on TextbookImprover itself: everything the
# user playbook installs, but by default a clone of main in place of a
# release, the full TeX Live in place of TinyTeX, every Pandoc the collection
# pins, LibreOffice, and what the test suites need beyond that. Run it on the
# machine itself:
#
#   ansible-playbook -i localhost, -c local -K oerforge.textbookimprover.developer
#
# Those choices are the roles' defaults for this profile, so an inventory or
# host_vars changes them, and -e over both (README, Settings).
- name: Set up TextbookImprover for working on it
  hosts: all
  gather_facts: true
  vars:
    # Which playbook this is; the roles' defaults follow it.
    ti_profile: developer
    ansible_python_interpreter: /usr/bin/python3
  roles:
    - oerforge.textbookimprover.base
    - oerforge.textbookimprover.python
    - oerforge.textbookimprover.pandoc
    - role: oerforge.textbookimprover.tex
      when: ti_tex | bool
    - role: oerforge.textbookimprover.fonts
      when: ti_fonts | bool
    - role: oerforge.textbookimprover.validators
      when: ti_validators | bool
    - role: oerforge.textbookimprover.browser_checks
      when: ti_browser_checks | bool
    - role: oerforge.textbookimprover.libreoffice
      when: ti_libreoffice | bool
    - oerforge.textbookimprover.developer
    - oerforge.textbookimprover.textbookimprover
